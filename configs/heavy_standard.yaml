# heavy_standard：自家英雄短焦自瞄/打符/吊射。本轮只做短焦，长焦切换忽略。
# 下面 camera_matrix / R_camera2gimbal 仍是同济 standard3 占位，上车前用圆点标定换成本车短焦。
enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
# jlcv-pc：Intel GPU + OpenCL NEO；无 GPU 时 resolve_ov_device 会回退 CPU
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
# 重装钉头：抄远程 jlauto-aim/hero processAssessment2（|v_yaw|大时 yaw 钉车中心）
nail_mode: true
nail_spin_on: 1.0          # rad/s 进入钉头
nail_spin_off: 0.7         # rad/s 退出钉头（滞回）
nail_fire_window_deg: 4.0  # 装甲相对视线夹角开火窗

yaw_offset: 2 # degree -2.5
pitch_offset: 6.5 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# --- 短焦占位（同济 standard3，非本车）--- 标定后整段替换 ---
# 重投影误差: 0.1820px
camera_matrix: [1785.4881526822305, 0, 672.4806478241826, 0, 1785.026019470562, 559.89603224794314, 0, 0, 1]
distort_coeffs: [-0.076005079619881746, 0.11182817466388446, 0.0005362204787722057, -0.0027546300984895122, 0]

# 相机同理想情况的偏角: yaw1.44 pitch-7.28 roll0.96 degree
# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw7.61 pitch13.92 roll-0.46 degree
R_camera2gimbal: [-0.027182119030230909, -0.12616154330853446, 0.99163723074269183, -0.99949106557517331, 0.019998323121329122, -0.024853106601381177, -0.016695575474690555, -0.99180811252093692, -0.12664093215554434]
t_camera2gimbal: [0.13160669975045827, 0.10377721766577375, 0.024908271912914642]
# --- 短焦占位结束 ---

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
# 自家英雄 jlcv_serial_driver。mode 在没收到前哨站位时用这个。
mode: auto_aim
bullet_speed: 16.5   # 本车统一弹速，不按长短焦改
serial_port: /dev/ttyUSB0
baud: 921600
deploy: false

# 吊射（mode: lob 时用）。门闩默认关。
target_x: 25.603
target_y: 8.000
target_z: 1.602
base_x: 6.429
base_y: 11.690
base_z: 0.828
base_yaw: 0.0
muzzle_dx: 0.0
muzzle_dy: 0.0
muzzle_dz: 0.4
friction_coeff: 0.001
pitch_max_deg: 42.0
yaw_tol: 0.02
pitch_tol: 0.02
open_loop: false
module_unlocked: false
module_docked: false
module_assembling: false
windmill_x: 14.5
windmill_y: 8.0
windmill_radius: 1.7
windmill_z_min: 0.2
windmill_z_max: 2.8

#####-----调试输出（heavy_standard）-----#####
# 保存即热加载：image_hz / image_scale / jpeg_quality / raw；其余（端口、imshow、mcap）需重启
debug:
  foxglove: true          # 笔记本 Foxglove 连 ws://192.168.1.25:8765
  foxglove_port: 8765
  image_hz: 15            # 推图上限；曲线每帧都推
  image_scale: 0.5        # 推图前缩放
  jpeg_quality: 75
  raw: true               # 同时推 /raw 原图（看曝光）
  imshow: false           # 本机窗口，仅 Remmina 兜底
  mcap: false             # 录 records/*.mcap，Foxglove 直接打开回看
  plot: true              # PlotJuggler UDP
  plot_host: 127.0.0.1
  plot_port: 9870
  record_fps: 60          # --record 录 avi 的帧率上限
