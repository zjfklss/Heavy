# 同济默认标定板；英雄板见 calibration_hero.yaml
pattern_cols: 10
pattern_rows: 7
center_distance_mm: 40

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 英雄云台：yaw/pitch 轴不共点（mm）。共点云台保持 [0,0,0]
p_yaw_to_pitch_mm: [0.0, 0.0, 0.0]
p_pitch_to_barrel_mm: [0.0, 0.0, 0.0]

camera_name: "hikrobot"
exposure_ms: 3
gain: 10.0
vid_pid: "2bdf:0001"

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

# 内参：跑完 calibrate_camera 后粘扁平字段到此，或手眼时用 --camera-info
# camera_matrix: [...]
# distort_coeffs: [...]

# 英雄串口采图（--attitude=serial）可覆盖
serial_port: /dev/ttyUSB0
baud: 921600
