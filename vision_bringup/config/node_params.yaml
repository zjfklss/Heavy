/camera_node:
  ros__parameters:
    camera_info_url: package://vision_bringup/config/camera_info.yaml
    camera_info_url1: package://vision_bringup/config/camera_info1.yaml
    camera_name: narrow_stereo
    camera_name1: narrow_stereo1
    camera_serial1: "DA9648617"
    camera_serial: "DA1830770" 
    exposure_time: 3000.0    #6000.0
    exposure_time1: 5000.0
    fps: 165.0
    gain: 16.0
    # 相机像素格式：bayer_rg8(推荐, 1.5MB/帧, 可跑满165fps) / rgb8(4.6MB/帧, 只有~79fps) / mono8
    pixel_format: "bayer_rg8"
    # SDK 内部图像缓存节点数，默认1，太小会在 host 处理稍慢时跳帧
    image_node_num: 8
    use_sensor_data_qos: true

/jlcv_serial_driver:
  ros__parameters:
    timestamp_offset: 0.006
    device_name: /dev/ttyUSB0
    baud_rate: 921600   #921600 or 115200
    flow_control: none
    parity: none
    stop_bits: "1"

/armor_detector:
  ros__parameters:
    debug: false
    detector_type: 1 # 0: "yolo" or 1: "traditional"
    debug_traditional: false
    flip: false
    use_record: true
    enemy_color: 1  # 0=红 1=蓝；现场装甲板为蓝
    binary_thres: 80   #80

    light:
      min_ratio: 0.02 #0.08
      max_ratio: 0.8  #0.4
    armor:
      min_light_ratio: 0.4 ##0.85

    classifier_threshold: 0.8
    ignore_classes: ["negative"] # ["negative","1","2","3","4","5"]

/armor_processor:
  ros__parameters:
    target_frame: world
    max_armor_distance: 12.0
    # infantry3 sigma2_q_xyz: 1e-3  sigma2_q_yaw: 1e1  sigma2_q_r: 80.0  r_xyz_factor: 4e-4  r_yaw: 1e-2
    ekf:
      sigma2_q_dz: 1e-6
      sigma2_q_xyz: 7e-3 #7e-3
      sigma2_q_a: 4e-4   #4e-6
      sigma2_q_r: 80.0
      sigma2_q_yaw: 4e-6 #9e-6  

      tau: 0.2
      r_xyz_factor: 4e-4
      r_yaw_factor: 4e-3
    imm:
      model0:
        sigma2_q_xyz: 7e-3 
        sigma2_q_a: 4e-6
        sigma2_q_yaw: 4e-6 
        sigma2_q_r: 80.0
      
      model2:
        sigma2_q_xyz: 7e-3 
        sigma2_q_a: 4e-6
        sigma2_q_yaw: 1e-5 
        sigma2_q_r: 80.0
    tracker:
      
      max_match_distance: 11.0     # 0.15  #0.85
      max_match_yaw_diff: 0.4     # 0.40
      debug: true

      tracking_thres: 3
      lost_time_thres: 1.0

/solve_angle:
  ros__parameters:
    scale : 0.12
    time_offset : 0.00
    pitch_offset : 0.00
    yaw_offset : 0.00
    pitch_offset1 : 0.0
    yaw_offset1 : 0.0
    shoot_delay: 0.075
    k_air_resistance: 0.0068  # Hero 42mm 平方阻；关掉会系统性欠补偿、弹着点偏下
    config0:
      bullet_speed: 15.9  # 实测约 15.6~16.0，取中值；运行时对电控上报做 EMA
      debug_pitch_offset: 0.000
      debug_yaw_offset: 0.000
    config1:
      bullet_speed: 15.9
      debug_pitch_offset: 0.000
      debug_yaw_offset: 0.000
